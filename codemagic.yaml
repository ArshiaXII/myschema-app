workflows:
  ios-workflow:
    name: iOS Workflow - MySchema
    max_build_duration: 120
    instance_type: mac_mini_m1
    working_directory: schemaflow_app
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.arshiamedia.myschema
      vars:
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        APP_STORE_APPLE_ID: 6752959178
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Clean Flutter build cache
        script: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf .dart_tool
          rm -rf build
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          cd ../ios
          pod install
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=100 \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Publish to App Store Connect
        script: |
          app-store-connect publish \
            --path build/ios/ipa/myschema_app.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - 82704919+ArshiaXII@users.noreply.github.com
        notify:
          success: true
          failure: true

